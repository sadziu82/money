<div class="mi mi-dialog-box-container">
    <form method="post" action="{{ url_for('view.account_create') }}">
        <div class="mi mi-dialog-box-header">adding new account</div>
        <div class="mi mi-dialog-box-section">
            <label for="name">name</label>
            <br>
            <input name="name" id="name" required>
        </div>
        <div class="mi mi-dialog-box-section">
            <label for="type">currency</label>
            <br>
            <select name="currency">
{% for currency in currency_list -%}
    {% if loop.first %}
                <option value="{{ currency.uuid }}" selected>
    {% else %}
                <option value="{{ currency.uuid }}">
    {% endif %}
                {{ currency.name }}
                </option>
{% endfor -%}
            </select>
        </div>
        <div class="mi mi-dialog-box-section">
            <label for="type">type</label>
            <br>
            <select name="account_type">
{% for type in account_type_list -%}
    {% if loop.first %}
                <option value="{{ type.uuid }}" selected>
    {% else %}
                <option value="{{ type.uuid }}">
    {% endif %}
                {{ type.name }}
                </option>
{% endfor -%}
            </select>
        </div>
        <div class="mi mi-dialog-box-section">
            <label for="initial balance">initial balance</label>
            <br>
            <input name="initial_balance" id="initial balance" required>
        </div>
        <div class="mi mi-dialog-box-section">
            <label for="debit limit">debit limit</label>
            <br>
            <input name="debit_limit" id="debit limit" required>
        </div>
        <div class="mi mi-dialog-box-section">
            <input type="submit" value="create">
            <input type="button" value="cancel" onClick='close_dialog();'>
        </div>
    </form>
</div>
