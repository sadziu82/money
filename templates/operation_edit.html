<form action="{{ url_for('operation_save', oid=operation.oid|default(0)) }}" method="POST" class="form-horizontal">
<table class="main-list" style="border: solid red 1px">
    <thead>
        <tr>
            <th width="3em">
            <th colspan="3">
                {% if operation == None %}
                add new operation
                {% else %}
                modify operation
                {% endif %}
            <th width="3em">
                <a href="#" onclick="shortcut.remove('Escape');">x</a>
    </thead>
    <tbody>
        <tr>
            <th colspan="2" width="234px" class="align-right">
                account:
            <th>
                {{ account.name }}
            <th colspan="2" width="234px">
        <tr>
            <th colspan="2" width="234px" class="align-right">
                amount:
            <th>
                <input type="text" name="amount" class="input-xlarge"
                       placeholder="amount" required value="{{ operation.amount }}">
            <th colspan="2" width="234px">
        <tr>
            <th colspan="2" class="align-right">
                type:
            <th>
                <select name="type">
{% for type in OPERATION_TYPE.keys() -%}
                    {% if type == operation.type %}
                    <option name="{{ type }}" selected>
                    {% else %}
                    <option name="{{ type }}">
                    {% endif %}
                        {{ OPERATION_TYPE[type] }}
                    </option>
{% endfor -%}
                </select>
            <th colspan="2">
                <button type="submit">
                {% if operation == None %}
                add operation
                {% else %}
                update operation
                {% endif %}
                </button>
    </tbody>
</table>
<input type="hidden" name="aid" value="{{ account.aid }}" />
<input type="hidden" name="tags" value="" />
</form>
