{% if account == None %}
<form action="{{ url_for('account_add') }}" method="POST" class="form-horizontal">
{% else %}
<form action="{{ url_for('account_modify', aid=account.aid) }}" method="POST" class="form-horizontal">
{% endif %}
<table class="main-list" style="border: solid red 1px">
    <thead>
        <tr>
            <th width="3em">
            <th colspan="3">
                {% if account == None %}
                add new account
                {% else %}
                modify account
                {% endif %}
            <th width="3em">
                <a href="#">x</a>
    </thead>
    <tbody>
        <tr>
            <th colspan="2" width="234px" class="align-right">
                name:
            <th>
                <input type="text" name="name" class="input-xlarge"
                       placeholder="account name" required value="{{ account.name }}">
            <th colspan="2" width="234px">
        <tr>
            <th colspan="2" class="align-right">
                initial balance:
            <th>
                <input type="text" name="initial_balance" class="input-xlarge"
                       placeholder="initial balance" required value="{{ account.initial_balance }}">
            <th colspan="2">
        <tr>
            <th colspan="2" class="align-right">
                type:
            <th>
                <select name="type">
{% for type in ACCOUNT_TYPE.keys() -%}
                    {% if type == account.type %}
                    <option name="{{ type }}" selected>
                    {% else %}
                    <option name="{{ type }}">
                    {% endif %}
                        {{ ACCOUNT_TYPE[type] }}
                    </option>
{% endfor -%}
                </select>
            <th colspan="2">
                <button type="submit">
                {% if account == None %}
                add account
                {% else %}
                update account
                {% endif %}
                </button>
    </tbody>
</table>
</form>
